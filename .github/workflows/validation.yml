name: Validate attention

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validation:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install NumPy
        run: python -m pip install numpy==2.3.5

      - name: Build and check correctness
        run: make test

      - name: Check memory safety and undefined behavior
        run: make sanitize

      - name: Validate all shapes
        run: python check.py --algorithm all --full --tiles